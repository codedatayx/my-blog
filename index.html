<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>杨轩的博客</title>
  <link rel="stylesheet" href="static/css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="navbar-brand">杨轩的博客</a>
      <ul class="navbar-links">
        <li><a href="index.html" class="active">首页</a></li>
        <li><a href="tags.html">标签</a></li>
        <li><a href="about.html">关于我</a></li>
      </ul>
    </div>
  </nav>

  <div class="container">
    <div class="hero">
      <h1>杨轩的博客</h1>
      <p class="subtitle">记录技术探索与生活感悟</p>
    </div>

    <div class="tags-filter" id="tagsFilter"></div>
    <div class="tags-filter" id="categoryFilter"></div>

    <div class="post-list" id="postList"></div>
  </div>

  <footer class="footer">
    <p>&copy; 2026 杨轩的博客 · 用代码书写故事</p>
  </footer>

  <script src="static/js/chat.js"></script>

  <script>
    const params = new URLSearchParams(window.location.search);
    const activeTag = params.get('tag');
    const activeCategory = params.get('category');
    let posts = [];
    let allTags = [];

    async function init() {
      const res = await fetch('data/posts.json');
      posts = await res.json();
      posts.sort((a, b) => b.date.localeCompare(a.date));

      allTags = [...new Set(posts.flatMap(p => p.tags))].sort();
      renderTags();
      renderCategories();
      renderPosts();
    }

    function renderTags() {
      const container = document.getElementById('tagsFilter');
      const html = allTags.map(tag =>
        `<button class="tag-btn ${tag === activeTag ? 'active' : ''}" onclick="filterByTag('${tag}')">${tag}</button>`
      ).join('');
      container.innerHTML = `<button class="tag-btn ${!activeTag ? 'active' : ''}" onclick="filterByTag(null)">全部</button>` + html;
    }

    function renderCategories() {
      const container = document.getElementById('categoryFilter');
      const allCats = [...new Set(posts.map(p => p.category || '未分类'))].sort();
      const html = allCats.map(cat =>
        `<button class="tag-btn ${cat === activeCategory ? 'active' : ''}" onclick="filterByCategory('${cat}')">${cat}</button>`
      ).join('');
      container.innerHTML = `<button class="tag-btn ${!activeCategory ? 'active' : ''}" onclick="filterByCategory(null)">全部分类</button>` + html;
    }

    function filterByTag(tag) {
      const p = new URLSearchParams(window.location.search);
      if (tag) p.set('tag', tag); else p.delete('tag');
      const qs = p.toString();
      window.location.href = qs ? `?${qs}` : window.location.pathname;
    }

    function filterByCategory(cat) {
      const p = new URLSearchParams(window.location.search);
      if (cat) p.set('category', cat); else p.delete('category');
      const qs = p.toString();
      window.location.href = qs ? `?${qs}` : window.location.pathname;
    }

    function renderPosts() {
      const container = document.getElementById('postList');
      let filtered = posts;
      if (activeTag) filtered = filtered.filter(p => p.tags.includes(activeTag));
      if (activeCategory) filtered = filtered.filter(p => (p.category || '未分类') === activeCategory);

      if (filtered.length === 0) {
        container.innerHTML = '<div class="empty-state"><p>暂无相关文章</p></div>';
        return;
      }

      container.innerHTML = filtered.map(post => `
        <article class="post-card" onclick="window.location.href='post.html?id=${post.id}'">
          <div class="post-card-meta">
            <span>${post.date}</span>
          </div>
          <h2><a href="post.html?id=${post.id}">${post.title}</a></h2>
          <p class="post-card-summary">${post.summary}</p>
          <div class="post-card-tags">
            ${post.tags.map(t => `<span class="tag-badge">${t}</span>`).join('')}
          </div>
        </article>
      `).join('');
    }

    init();
  </script>
</body>
</html>
