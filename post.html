<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文章详情</title>
  <link rel="stylesheet" href="static/css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="navbar-brand">杨轩的博客</a>
      <ul class="navbar-links">
        <li><a href="index.html">首页</a></li>
        <li><a href="tags.html">标签</a></li>
        <li><a href="about.html">关于我</a></li>
      </ul>
    </div>
  </nav>

  <div class="container">
    <a href="index.html" class="back-link">&larr; 返回首页</a>

    <article class="post-detail" id="postDetail">
      <div class="empty-state"><p>文章不存在</p></div>
    </article>
  </div>

  <footer class="footer">
    <p>&copy; 2026 杨轩的博客 · 用代码书写故事</p>
  </footer>

  <script src="static/js/chat.js"></script>

  <script>
    async function init() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      if (!id) return;

      const res = await fetch('data/posts.json');
      const posts = await res.json();
      const post = posts.find(p => p.id === id);
      if (!post) return;

      document.title = `${post.title} - 杨轩的博客`;

      document.getElementById('postDetail').innerHTML = `
        <header class="post-detail-header">
          <h1>${post.title}</h1>
          <div class="meta">
            <span>${post.date}</span>
            <div class="post-card-tags">
              ${post.tags.map(t => `<span class="tag-badge">${t}</span>`).join('')}
            </div>
          </div>
        </header>
        <div class="post-detail-content">
          ${post.content}
        </div>
        <div class="post-detail-tags">
          ${post.tags.map(t => `<a href="index.html?tag=${encodeURIComponent(t)}"><span class="tag-badge">${t}</span></a>`).join('')}
        </div>
      `;

      // Inject inline chat after the article
      document.getElementById('postDetail').insertAdjacentHTML('afterend', `
        <div class="inline-chat" id="inlineChat">
          <h3 class="inline-chat-title">问我的数字分身</h3>
          <div class="inline-chat-messages" id="inlineChatMessages">
            <div class="chat-msg system">我就是杨轩本人，不是什么AI模型。随便问，聊聊技术、工作、生活都行。</div>
          </div>
          <div class="inline-chat-suggestions" id="inlineChatSuggestions">
            <button onclick="ChatBot.inlineAsk('这篇文章讲了什么？')">这篇文章讲了什么</button>
            <button onclick="ChatBot.inlineAsk('有什么相关的文章推荐？')">相关文章推荐</button>
            <button onclick="ChatBot.inlineAsk('你写这篇文章的初衷是什么？')">写作初衷</button>
          </div>
          <div class="inline-chat-input">
            <input type="text" id="inlineChatInput" placeholder="随便问，不用客气..." autocomplete="off">
            <button onclick="ChatBot.inlineSend()">发送</button>
          </div>
        </div>
      `);
    }

    init();
  </script>
</body>
</html>
